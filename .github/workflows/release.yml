name: Release safety

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  actions: write
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-scan-release:
    name: Build, scan, and release
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/server/package-lock.json

      - name: Require VirusTotal secret
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VIRUSTOTAL_API_KEY)) {
            throw "Add the rotated VIRUSTOTAL_API_KEY repository secret before running releases."
          }

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./src/server/package.json').version"
          $expectedTag = "v$packageVersion"

          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match src/server/package.json version $packageVersion."
          }

      - name: Install dependencies
        shell: pwsh
        run: npm --prefix src/server ci --omit=dev

      - name: Run fast source and dependency checks
        shell: pwsh
        run: |
          npm run check
          npm --prefix src/server run check
          Get-Content src/server/message_renderer/message_renderer.js -Raw |
            node --input-type=module --check
          Get-Content src/server/message_renderer/chat_renderer.js -Raw |
            node --input-type=module --check
          npm audit --omit=dev --audit-level=high
          npm --prefix src/server audit --omit=dev --audit-level=high

      - name: Build Windows release package
        shell: pwsh
        run: ./src/server/make-release.ps1

      - name: Verify generated checksum
        shell: pwsh
        run: |
          $zip = "src/server/release/ChatBubble.zip"
          $checksumFile = "src/server/release/ChatBubble.zip.sha256"
          $expected = (Get-Content $checksumFile).Split(" ")[0].Trim()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($actual -ne $expected) {
            throw "Generated checksum does not match the release ZIP."
          }

      - name: Scan release with VirusTotal
        id: virustotal
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          node tools/virustotal-scan.mjs `
            src/server/release/ChatBubble.zip `
            src/server/release

      - name: Retain release evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-safety-${{ github.ref_name }}
          path: |
            src/server/release/ChatBubble.zip
            src/server/release/ChatBubble.zip.sha256
            src/server/release/release-safety.json
            src/server/release/release-safety.md
          if-no-files-found: warn
          retention-days: 30

      - name: Compose release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          @(
            Get-Content "src/server/RELEASE NOTES.md" -Raw
            ""
            Get-Content "src/server/release/release-safety.md" -Raw
          ) | Set-Content "src/server/release/github-release-notes.md"

      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            --verify-tag `
            --draft `
            --title "Chat Bubble $env:GITHUB_REF_NAME" `
            --notes-file src/server/release/github-release-notes.md `
            src/server/release/ChatBubble.zip `
            src/server/release/ChatBubble.zip.sha256 `
            src/server/release/release-safety.json

      - name: Publish verified GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit $env:GITHUB_REF_NAME --draft=false

      - name: Start post-release behavior check
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release-behavior.yml `
            --ref main `
            -f release_tag=$env:GITHUB_REF_NAME
